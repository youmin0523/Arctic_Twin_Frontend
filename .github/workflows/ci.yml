name: ci-frontend

# ============================================================
# 프론트엔드 자동 테스트 — push / PR 시 Vitest(서비스+컴포넌트)와 프로덕션 빌드를
# 실행해 회귀를 차단한다. (배포는 Vercel 이 별도로 담당)
# ============================================================

on:
  push:
    branches: [MS, develop, main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: 단위·컴포넌트 테스트 (Vitest)
        run: npm test
      - name: 프로덕션 빌드 검증
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Playwright 브라우저 설치 (chromium)
        run: npx playwright install --with-deps chromium
      - name: E2E 렌더 스모크 (백엔드 없이 graceful degradation 검증)
        run: npm run e2e
